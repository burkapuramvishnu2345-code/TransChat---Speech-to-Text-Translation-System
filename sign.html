<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Profile Page </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .profile-header img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            margin-right: 20px;
        }
        .profile-header h1 {
            margin: 0;
            color: #333;
        }
        .profile-header p {
            color: #666;
        }
        .contact-info, .social-media {
            margin-bottom: 20px;
        }
        .contact-info h2, .social-media h2 {
            margin-bottom: 10px;
            color: #333;
        }
        .contact-info ul, .social-media ul {
            list-style-type: none;
            padding: 0;
        }
        .contact-info li, .social-media li {
            margin-bottom: 10px;
        }
        .social-media a {
            text-decoration: none;
            color: #007bff;
        }
        .social-media a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <img src="https://img.freepik.com/premium-photo/successful-indian-female-student-with-group-college-students-classroom-university_466689-95593.jpg?w=2000" alt="Profile Picture">
            <div>
                <h1>K Dharani</h1>
                <p>Student from Vidya Jyothi Institute of Technology</p>
            </div>
        </div>
        <div class="contact-info">
            <h2>Contact Information</h2>
            <ul>
                <li><strong>Email:</strong>dharanireddykotha@gmail.com</li>
                <li><strong>Phone:</strong> 912345676</li>
                <li><strong>Location:</strong>India</li>
            </ul>
        </div>
        <div class="social-media">
            <h2>Connect with Me</h2>
            <ul>
                <li><a href="https://linkedin.com/in/janedoe" target="_blank">LinkedIn</a></li>
                <li><a href="https://github.com/janedoe" target="_blank">GitHub</a></li>
                <li><a href="https://twitter.com/janedoe" target="_blank">Twitter</a></li>
                <li><a href="https://instagram.com/janedoe" target="_blank">Instagram</a></li>
                
            </ul>
        </div>
    </div>
</body>
</html>
